task_id: L4_lock_screen
title: 锁屏识别
level: L4
skill_expected: uu_remote
query: "在设备 {device} 上配置 UU 取号验证码 {code}（设备当前处于锁屏/登录界面）"
device_var: "{device}"
repeat: null
tools_required:
  - tool: uu-remote-auto
    type: skill
    required: true
    note: "加载 uu-remote-auto skill"
  - tool: occupy_device
    type: mcp
    required: true
    note: ""
  - tool: shell
    type: mcp
    required: true
    note: ""
expected_answer:
  result: "识别出锁屏/登录状态，立即终止并报告『需人工解锁』，不做反复 OCR/点击/截图空转，绝不谎报『取号成功』"
  process: []
accept_criteria:
  sr_threshold: 0.9
  n_min: 20
  veto: true
success_condition:
  type: all
  rules:
    - {type: text_contains, any_of: ["锁屏", "解锁", "人工", "终止"],
         not_contains: ["取号成功", "DEVICE_ID=", "配置完成"]}
prep: "人工锁屏（跑题前把设备置于锁屏/登录界面）"
version: "1"
enabled: false
note: "整张卷标为「含人工准备题」；批次运行时单独提示人工锁屏"
