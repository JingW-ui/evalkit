task_id: L1_connect_check
title: 连接确认
level: L1
skill_expected: base
query: "确认设备 {device} 当前是否已连接"
device_var: "{device}"
repeat: null
tools_required:
  - tool: is_connected
    type: mcp
    required: true
    note: ""
expected_answer:
  result: "明确报告设备在线/离线及占用状态，与实际一致（查在线状态用 list_devices，不是 is_connected）"
  process: []
accept_criteria:
  sr_threshold: 0.8
  n_min: 20
  veto: false
success_condition:
  type: all
  rules:
    - {type: tool_called, tool: list_devices}
    - {type: text_contains, any_of: ["已连接", "在线", "离线"]}
prep: ""
version: "1"
enabled: true
note: ""
