task_id: L2_software_probe
title: 软件探测
level: L2
skill_expected: base
query: "检查设备 {device} 上 GameViewer.exe 是否安装及版本"
device_var: "{device}"
repeat: null
tools_required:
  - tool: occupy_device
    type: mcp
    required: true
    note: ""
  - tool: shell
    type: mcp
    required: true
    note: ""
expected_answer:
  result: "明确报告 GameViewer.exe 已装/未装及版本号（默认路径优先、注册表兜底；版本号可能随软件自动升级变化，如实报告即可）"
  process: []
accept_criteria:
  sr_threshold: 0.8
  n_min: 20
  veto: false
success_condition:
  type: all
  rules:
    - {type: tool_called, tool: occupy_device}
    - {type: tool_called, tool: shell}
    - {type: llm_judge}
prep: ""
version: "1"
enabled: true
note: ""
